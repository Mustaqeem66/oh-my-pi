name: tmp-lint-probe
on:
  push:
    branches: [fix/5372-loop-wedge-sentinel]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        continue-on-error: true
      - name: Run checks and capture output
        run: |
          set +e
          {
            echo "=== bun run check:ts ==="
            bun run check:ts 2>&1
            echo "exit=$?"
          } > lint-probe-output.txt
          tail -c 40000 lint-probe-output.txt > lint-probe-tail.txt
          mv lint-probe-tail.txt lint-probe-output.txt
          true
      - name: Commit output and self-delete
        run: |
          git config user.name "lint-probe"
          git config user.email "lint-probe@users.noreply.github.com"
          git rm .github/workflows/tmp-lint-probe.yml
          git add lint-probe-output.txt
          git commit -m "chore: lint probe output (temporary) [skip ci]"
          git push
