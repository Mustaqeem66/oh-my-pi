name: Repair symbols.ts (one-off, self-deleting)
on:
  push:
    branches: [fix/5112-oauth-billing-label]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pristine symbols.ts and apply (oauth) rename
        run: |
          set -euo pipefail
          F=packages/coding-agent/src/modes/theme/symbols.ts
          # Restore the byte-exact original from the upstream main pin this branch was cut from.
          git show 72000acfeb902e21816252699482887f34d1a5a4:$F > $F
          # Fail closed: pristine blob must match the known upstream original.
          test "$(git hash-object $F)" = "64a02fff29519d2825f388ff4a67e2398443d01d"
          # The only intended change: rename the (sub) billing label to (oauth) (2 occurrences).
          sed -i 's/"icon\.subscription": "(sub)",/"icon.subscription": "(oauth)",/' $F
          # Fail closed: result must be exactly the pre-verified fixed blob.
          test "$(git hash-object $F)" = "b4b270c38711f8a3ef5f4d72697241d51c484752"
          # Remove this one-off workflow so the PR diff stays clean.
          git rm -q .github/workflows/repair-symbols.yml
          git config user.name "Mustaqeem66"
          git config user.email "Mustaqeem66@users.noreply.github.com"
          git add $F
          git commit -m "fix(tui): restore raw glyphs in symbols.ts with (oauth) label (#5112)"
          git push origin HEAD:fix/5112-oauth-billing-label
