# Temporary, self-removing workflow for #2394: applies .github/bootstrap-2394.py
# (three small anchored insertions into files too large to push via the API
# tooling used to prepare this branch), then deletes the bootstrap and itself.
name: bootstrap-2394
on:
  push:
    branches: ["fix/2394-chat-transparent"]
    paths: [".github/bootstrap-2394.py"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply anchored insertions and remove bootstrap
        run: |
          python3 .github/bootstrap-2394.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/bootstrap-2394.py .github/workflows/bootstrap-2394.yml
          git add packages/coding-agent/src/main.ts packages/coding-agent/src/modes/controllers/selector-controller.ts packages/coding-agent/src/config/settings-schema.ts
          git commit -m "feat(settings): register chat.transparent, wire startup + selector (#2394, 4/4)"
          git push
