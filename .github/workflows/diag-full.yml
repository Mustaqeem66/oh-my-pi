name: diag-full

on:
   push:
      branches: [diag/966-log]

permissions:
   contents: write

jobs:
   diag:
      runs-on: ubuntu-22.04
      timeout-minutes: 40
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2

         - name: Fetch release native addons (npm)
           shell: bash
           run: |
              set -euo pipefail
              tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
              echo "tarball=$tarball"
              curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"

         - name: Install deps
           shell: bash
           run: bun install --frozen-lockfile

         - name: Install native targets
           shell: bash
           run: |
              set +e
              cp -v "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
              cp -v "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
              ls -la packages/natives/native/
              exit 0

         - name: Run full native bucket
           shell: bash
           env:
              OMP_TEST_CONCURRENCY: 4
           run: |
              set +e
              bun run ci:test:coding-agent:native > diag-full.txt 2>&1
              echo "----- exit=$? -----" >> diag-full.txt
              exit 0

         - name: Build summary
           shell: bash
           run: |
              set +e
              {
                 echo "=== failing lines ==="
                 grep -n -E "(FAIL|fail\)|error:|Expected:|Received:|exit=|not ok)" diag-full.txt | tail -n 400
                 echo
                 echo "=== tail 400 ==="
                 tail -n 400 diag-full.txt
              } > diag-summary.txt
              wc -l diag-full.txt diag-summary.txt
              exit 0

         - name: Commit captured output
           shell: bash
           run: |
              set -euo pipefail
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git rm -f --ignore-unmatch .github/workflows/diag-full.yml
              git add -f diag-summary.txt
              git commit -m "diag: capture full native bucket summary [skip ci]"
              git push origin HEAD:diag/966-log
