name: bootstrap-10124

on:
  push:
    branches:
      - fix/10124-session-init-approval-provenance

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply anchored edits
        run: python3 .github/bootstrap-10124.py
      - name: Remove bootstrap files
        run: |
          rm -f .github/bootstrap-10124.py
          rm -f .github/workflows/bootstrap-10124.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(session): record approval provenance on subagent session_init (#10124)"
          git push
