name: diag-966

on:
   push:
      branches: [diag/966-log]

permissions:
   contents: write

jobs:
   diag:
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2

         - name: Fetch release native addons (npm)
           shell: bash
           run: |
              set -euo pipefail
              tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
              echo "tarball=$tarball"
              curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
              mkdir -p bazel-bin/natives-linux-x64-baseline bazel-bin/natives-linux-x64-modern
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" bazel-bin/natives-linux-x64-baseline/
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" bazel-bin/natives-linux-x64-modern/

         - name: Install deps
           shell: bash
           run: bun install --frozen-lockfile

         - name: Install native targets
           shell: bash
           run: |
              set +e
              bun scripts/bazel-natives.ts linux-x64-baseline linux-x64-modern \
                --source "$RUNNER_TEMP" --dest packages/natives/native
              echo "bazel-natives.ts exit=$?"
              # Fallback: the loader reads these exact filenames from the
              # package's native/ dir, so a plain copy is equivalent.
              cp -v "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
              cp -v "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
              ls -la packages/natives/native/
              exit 0

         - name: Run issue-966 test repeatedly
           shell: bash
           run: |
              set +e
              out="$GITHUB_WORKSPACE/diag-output.txt"
              : > "$out"
              {
                 echo "bun: $(bun --version)"
                 echo "git: $(git --version)"
                 echo "kernel: $(uname -a)"
                 echo "fs: $(stat -f -c %T "$RUNNER_TEMP")"
                 echo
              } >> "$out"
              cd packages/coding-agent
              for i in 1 2 3 4 5; do
                 echo "===== RUN $i =====" >> "$out"
                 bun test test/issue-966-repro.test.ts --timeout=60000 >> "$out" 2>&1
                 echo "----- exit=$? -----" >> "$out"
                 echo >> "$out"
              done
              exit 0

         - name: Commit captured output
           shell: bash
           run: |
              set -euo pipefail
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git rm -f --ignore-unmatch .github/workflows/diag-966.yml
              git add -f diag-output.txt
              git commit -m "diag: capture issue-966 test output [skip ci]"
              git push origin HEAD:diag/966-log
